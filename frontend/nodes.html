<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRISHTI · Node Status</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.grid{grid-column:span 12;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.nc{background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:16px;animation:rise .5s ease both;transition:border-color .4s,box-shadow .4s}
.nc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nc .id{font:700 20px 'Chakra Petch';letter-spacing:.06em}
.gauges{display:flex;gap:10px;justify-content:space-between;margin:10px 0}
.g1{width:74px;height:74px}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px;margin:10px 0}
.rows div b{color:var(--mu);font-weight:500;display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.rows div span{font:600 14px 'Chakra Petch'}
.mini{width:100%;height:44px;display:block;margin-top:8px}
.uptime{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-top:10px}
.uptime i{display:block;height:100%;background:var(--hz);transition:width .6s}
.advice{font-size:12px;color:var(--mu);margin-top:10px;line-height:1.5;border-top:1px dashed var(--ln);padding-top:10px}
</style></head>
<body><header><div class="logo">DR<i>I</i>SHTI</div><div class="sub">Node Status · live per-sensor telemetry &amp; link health</div>
<nav class="nav"><a href="index.html">Overview</a><a href="nodes.html" class="on">Node Status</a><a href="analytics.html">Analytics</a></nav>
<span class="spacer"></span><span id="st"><i class="dot"></i>OFFLINE</span>
<button id="cx" onclick="toggleSerial(this)">⚡ Connect Gateway (USB)</button><button id="dm" onclick="dmToggle()">▶ Demo mode</button>
<select id="sc" style="display:none" onchange="D.scen=+this.value"><option value="0">Scenario: Normal</option><option value="1">Flash flood</option><option value="2">Wildfire</option><option value="3">Gas leak</option></select></header>
<main><div class="grid" id="grid"><div class="empty">No nodes have reported yet. Connect the gateway or start Demo mode.</div></div></main>
<script src="core.js"></script>
<script>
function dmToggle(){D.demo?stopDemo():startDemo();$('dm').classList.toggle('on',!!D.demo);$('sc').style.display=D.demo?'':'none'}
function statusUI(){const s=statusInfo();$('st').innerHTML=`<i class="dot ${s.live||s.be?'live':''}"></i>${s.label}`}
document.addEventListener('drishti:status',statusUI);
const RANGE={water:600,surge:40,gas:400,grate:40,temp:80,vib:20};
document.addEventListener('drishti:data',e=>renderCard(e.detail.id,true));
document.addEventListener('drishti:tick',()=>Object.keys(D.N).forEach(id=>renderCard(+id,false)));
document.addEventListener('drishti:seeded',()=>Object.keys(D.N).forEach(id=>renderCard(+id,false)));
function ensureCard(id){if($('nc'+id))return;const wrap=document.createElement('div');wrap.className='nc';wrap.id='nc'+id;
wrap.innerHTML=`<div class="top"><div class="id">NODE ${String(id).padStart(2,'0')}</div><span class="pill" id="p${id}">—</span></div>
<div class="gauges">${METRICS.slice(0,3).map(m=>`<div class="gaugewrap g1"><canvas id="g_${id}_${m.k}" width="74" height="74"></canvas><span id="gv_${id}_${m.k}"></span></div>`).join('')}</div>
<div class="rows">${METRICS.map(m=>`<div><b>${m.l}</b><span id="r_${id}_${m.k}">--</span></div>`).join('')}</div>
<canvas class="mini" id="mini${id}"></canvas>
<div class="uptime"><i id="up${id}" style="width:0%"></i></div>
<div class="advice" id="adv${id}"></div>`;
const grid=$('grid');if(grid.querySelector('.empty'))grid.innerHTML='';grid.appendChild(wrap)}
function renderCard(id,pulse){const n=D.N[id];if(!n)return;ensureCard(id);const L=n.last,H0=HAZ[n.cls],st=Date.now()-n.t>10000;
const card=$('nc'+id);card.style.borderColor=st?'var(--ln)':H0.c;
$('p'+id).textContent=st?'STALE':H0.n;$('p'+id).style.background=st?'#6d8790':H0.c;
METRICS.slice(0,3).forEach(m=>{const pct=Math.min(1,Math.abs(L[m.k])/RANGE[m.k]);gauge($('g_'+id+'_'+m.k),pct,H0.c);$('gv_'+id+'_'+m.k).textContent=L[m.k]});
METRICS.forEach(m=>$('r_'+id+'_'+m.k).textContent=L[m.k]+' '+m.u);
line($('mini'+id),[[n.h.map(x=>x.water),'#38bdf8'],[n.h.map(x=>x.gas),'#a855f7'],[n.h.map(x=>x.temp),'#f97316']]);
const link=n.seq==null?100:100*n.n/(n.n+n.lost);$('up'+id).style.width=link.toFixed(0)+'%';
$('adv'+id).textContent=n.seq==null?`${n.n} packets received · `+H0.a:`seq ${n.seq} · ${n.lost} lost · ${link.toFixed(0)}% link · `+H0.a;
if(pulse){card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash')}}
addEventListener('resize',()=>Object.keys(D.N).forEach(id=>renderCard(+id,false)));
statusUI();seed();connectWS();
</script></body></html>
